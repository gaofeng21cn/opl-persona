name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and validate Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out OPL Python Client SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab
          ref: main
          path: framework
          sparse-checkout: sdks/python-client
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/framework/sdks/python-client/src:${{ github.workspace }}/runtime
        run: python -m pytest -q

      - name: Validate JSON and v2 Package structure
        run: |
          python -m json.tool opl-package.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("opl-package.json").read_text(encoding="utf-8"))
          assert manifest["schema_version"] == "opl.package.v2"
          assert manifest["identity"]["id"] == "opl-persona"
          assert manifest["identity"]["version"]
          assert Path(manifest["provides"]["skills"][0]["path"], "SKILL.md").is_file()
          assert Path(manifest["provides"]["cli_bin"][0]["path"]).is_file()
          assert Path("runtime/opl_persona/cli.py").is_file()
          PY

      - name: Verify user documentation links
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          documents = (
              Path("README.md"),
              Path("README.zh-CN.md"),
              Path("docs/distribution.md"),
          )
          link_pattern = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          for document in documents:
              for target in link_pattern.findall(document.read_text(encoding="utf-8")):
                  target = target.split("#", 1)[0]
                  if not target or "://" in target or target.startswith("mailto:"):
                      continue
                  assert (document.parent / target).exists(), f"{document}: missing {target}"
          PY
